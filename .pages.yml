media:
  input: images
  output: /images
content:
  - name: stories
    label: My Stories
    type: file
    path: stories.json
    format: json
    fields:
      - name: senarai
        label: Koleksi Cerita Anda
        type: list
        fields:
          - name: title
            label: Tajuk Cerita
            type: string
          - name: genre
            label: Genre (e.g., Hutan Mistis, Kerajaan Lautan)
            type: string
          - name: image
            label: Cover Image URL (Paste any Unsplash link!)
            type: string
          - name: excerpt
            label: Story Excerpt (Short description for card)
            type: string
          - name: body
            label: Write your story here
            type: rich-text
