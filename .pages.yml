media:
  input: images
  output: /images
content:
  - name: stories
    label: My Stories
    type: file
    path: stories.json
    format: json
    fields:
      - name: items
        label: Stories List
        type: list
        fields:
          - name: title
            label: Story Title
            type: string
          - name: genre
            label: Genre (e.g., Hutan Mistis, Kerajaan Lautan)
            type: string
          - name: image
            label: Cover Image URL (You can paste any Unsplash image link!)
            type: string
          - name: excerpt
            label: Story Excerpt (Short description for the card)
            type: string
          - name: date
            label: Publish Date
            type: date
          - name: body
            label: Write your story here
            type: rich-text
